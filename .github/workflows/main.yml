name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run fmt:ci
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
      - run: npm run check-exports
